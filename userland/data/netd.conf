# /etc/netd.conf - MyOS Network Gateway Daemon configuration
default_ports=80,443,8080,8443
default_timeout_ms=5000
default_max_size=262144

[principal:testagent]
allow_private=true
domains=10.0.2.2,testnet.local,*.example.com

[principal:agent1]
allow_private=false
domains=*.example.com,api.github.com
