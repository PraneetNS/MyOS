name: Feature Request
description: Suggest an idea or enhancement for MyOS
labels: ["enhancement"]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: What capability or improvement would you like to see?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation / Use Case
      description: Why is this feature needed or useful in an AI-native OS?
    validations:
      required: true

