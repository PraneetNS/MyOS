name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *' # Nightly full test suite at 02:00 UTC
  workflow_dispatch:

jobs:
  build-and-smoke:
    name: Build & Smoke Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib mtools dosfstools grub-pc-bin grub-common xorriso qemu-system-x86 python3 python3-pip

      - name: Cache Cross Toolchain
        id: cache-cross
        uses: actions/cache@v4
        with:
          path: /opt/myos-cross
          key: ${{ runner.os }}-x86_64-elf-toolchain-v1

      - name: Fallback Toolchain Setup
        if: steps.cache-cross.outputs.cache-hit != 'true'
        run: |
          echo "Toolchain cache miss. Checking x86_64-elf-gcc..."
          sudo mkdir -p /opt/myos-cross

      - name: Build Kernel & Userland
        run: |
          export PATH=/opt/myos-cross/bin:$PATH
          make clean
          make all
          userland/build.sh

      - name: Build FAT16 Disk Image
        run: |
          ./tools/build_disk.sh

      - name: Fast Smoke Test (Boot & Init under QEMU)
        timeout-minutes: 5
        run: |
          python3 -c '
          import subprocess, sys, time

          cmd = [
              "qemu-system-x86_64", "-m", "256",
              "-cdrom", "myos.iso",
              "-drive", "file=disk.img,format=raw,index=0,media=disk",
              "-boot", "d",
              "-serial", "stdio",
              "-display", "none",
              "-no-reboot"
          ]
          proc = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
          start_time = time.time()
          found_shell = False
          output_lines = []

          while time.time() - start_time < 30:
              line = proc.stdout.readline()
              if line:
                  output_lines.append(line)
                  print(line, end="")
                  if "MyOS" in line or "init" in line or "Starting" in line or "myos>" in line:
                      found_shell = True
                      break
              if proc.poll() is not None:
                  break

          proc.terminate()
          try:
              proc.wait(timeout=3)
          except subprocess.TimeoutExpired:
              proc.kill()

          if not found_shell:
              print("\nError: Did not see boot banner in serial output within 30s")
              sys.exit(1)
          print("\nSmoke test PASSED: Kernel booted successfully!")
          '

      - name: Packet Fuzz Test
        timeout-minutes: 5
        run: |
          python3 tools/packet_fuzz.py

      - name: Upload Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: |
            *.log
            /tmp/*.log
            disk.img

  nightly-tests:
    name: Nightly Full Regression (Sessions 1-23)
    runs-on: ubuntu-22.04
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib mtools dosfstools grub-pc-bin grub-common xorriso qemu-system-x86 python3 python3-pip musl-tools tcc ovmf

      - name: Build Everything
        run: |
          make clean
          make all
          userland/build.sh
          ./tools/build_disk.sh

      - name: Run Full Test Boot Suite
        timeout-minutes: 30
        run: |
          ./tools/test_boot.sh

      - name: Nightly High-Volume Syscall Fuzzing (300,000 calls)
        timeout-minutes: 25
        run: |
          python3 tools/test_sysfuzz.py --iterations 300000 --seed 0x1337c0de --timeout 300

      - name: Upload Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-logs
          path: |
            *.log
            /tmp/*.log
            *.png
            disk.img

