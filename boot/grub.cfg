set timeout=0
set default=0

insmod all_video
set gfxpayload=1024x768x32

menuentry "MyOS" {
    multiboot2 /boot/myos.bin mode=text
    boot
}

menuentry "MyOS (kshell)" {
    multiboot2 /boot/myos.bin kshell
    boot
}

menuentry "MyOS (serial_shell)" {
    multiboot2 /boot/myos.bin serial_shell=1
    boot
}

menuentry "MyOS (desktop)" {
    multiboot2 /boot/myos.bin mode=desktop
    boot
}
